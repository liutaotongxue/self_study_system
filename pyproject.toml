[project]
name = "self-learning-agent"
version = "0.1.0"
description = "Self-learning agent that generates notes and questions from PDF textbooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.40",
    "python-multipart>=0.0.9,<0.1",   # FastAPI 文件/表单上传硬依赖(P2 /upload);缺则新克隆 upload 500
    # Data
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    # LLM SDK
    "anthropic>=0.40,<2.0",
    "google-genai>=1.0,<2.0",        # S4 OCR (Gemini) via langchain wrapper
    # Agent runtime (langchain 1.x ecosystem)
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "langchain-anthropic>=1.0,<2.0",
    "langchain-google-genai>=4.0,<5.0",
    "langchain-core>=1.0,<2.0",
    "langchain>=1.0,<2.0",
    # PDF/解析/嵌入(API 启动 + S2/S4/KG anchor 全链路硬依赖)
    "pymupdf>=1.24",
    "langchain-text-splitters>=1.0,<2.0",
    "sentence-transformers>=3.0",   # KG anchor embedding;拖入 torch ~800MB-1.5GB
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sla"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
